name: Format C++ once

on:
  push:
    paths:
      - .github/workflows/format-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: Apply project formatting
        run: |
          clang-format -i src/*.cpp include/muffle/*.hpp tests/*.cpp
          python3 tools/check_source.py
      - name: Commit format-only changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add src include/muffle tests
          if ! git diff --cached --quiet; then
            git commit -m 'style: apply clang-format to C++ sources'
            git push origin "HEAD:${{ github.ref_name }}"
          fi
