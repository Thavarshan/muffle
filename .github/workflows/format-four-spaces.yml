name: Apply C++ four-space formatting

on:
    push:
        branches:
            - style/four-space-indentation
        paths:
            - .github/workflows/format-four-spaces.yml

permissions:
    contents: write

jobs:
    format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.ref_name }}
            - name: Install clang-format
              run: |
                  sudo apt-get update
                  sudo apt-get install -y clang-format
            - name: Apply repository C++ formatting
              run: |
                  clang-format -i src/*.cpp include/muffle/*.hpp \
                      tests/*.cpp
                  python3 tools/check_source.py
            - name: Commit formatted files
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email \
                      '41898282+github-actions[bot]@users.noreply.github.com'
                  git add src include/muffle tests
                  if ! git diff --cached --quiet; then
                      git commit -m 'style: format C++ with four spaces'
                      git push origin "HEAD:${{ github.ref_name }}"
                  fi
